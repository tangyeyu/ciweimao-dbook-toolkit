plugins {
    id 'com.android.application'
}

android {
    namespace 'com.duoluoxi.reader'
    compileSdk 34

    defaultConfig {
        applicationId "com.duoluoxi.reader"
        minSdk 26
        targetSdk 34
        versionCode 12
        versionName "3.0"
        // App 显示名动态带版本号：段评书架 v3.0（升级只改 versionName）
        resValue "string", "app_name", "段评书架 v${versionName}"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}
